plugins {
    alias(libs.plugins.android.application)
}

def backendBaseUrl = project.findProperty("BACKEND_BASE_URL") ?: "http://10.0.2.2:8000/"
if (!backendBaseUrl.endsWith("/")) {
    backendBaseUrl += "/"
}
def backendDevelopmentUserId = project.findProperty("BACKEND_DEVELOPMENT_USER_ID") ?: ""
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def mapsApiKey = (localProperties.getProperty("MAPS_API_KEY")
        ?: System.getenv("MAPS_API_KEY")
        ?: "").trim()
def mapsApiKeyConfigured = mapsApiKey ==~ /AIza[A-Za-z0-9_-]{35}/

android {
    namespace 'com.example.smartcivicapp'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.example.smartcivicapp"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "BACKEND_BASE_URL", "\"${backendBaseUrl}\""
        buildConfigField "String", "BACKEND_DEVELOPMENT_USER_ID", "\"${backendDevelopmentUserId}\""
        buildConfigField "boolean", "GOOGLE_MAPS_API_KEY_CONFIGURED", "${mapsApiKeyConfigured}"
        manifestPlaceholders = [googleMapsApiKey: mapsApiKey]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

}
